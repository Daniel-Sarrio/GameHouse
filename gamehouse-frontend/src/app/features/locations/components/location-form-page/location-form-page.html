<div class="contenedor pagina">
  <a routerLink="/lugares" class="volver">← Volver a lugares</a>
  <p class="eyebrow">GAMEHOUSE / {{ editando() ? 'EDITAR' : 'CREAR' }}</p>
  <h1>{{ editando() ? 'Editar lugar' : 'Nuevo lugar' }}</h1>
  <p class="subtitulo">Completa los datos de este lugar.</p>
  @if (!editando()) {
    <app-location-form [guardando]="guardando()" [errorServidor]="errorServidor()" (guardar)="guardar.emit($event)" (cancelar)="cancelar.emit()" />
  } @else if (cargando()) {
    <app-estado-carga texto="Cargando lugar…" />
  } @else if (errorCarga(); as mensaje) {
    <app-mensaje-error [mensaje]="mensaje" (reintentar)="reintentar.emit()" />
  } @else if (lugar(); as actual) {
    <app-location-form [lugar]="actual" [guardando]="guardando()" [errorServidor]="errorServidor()" (guardar)="guardar.emit($event)" (cancelar)="cancelar.emit()" />
  }
</div>
