<form class="formulario" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  @if (errorServidor(); as mensaje) { <div class="alerta" role="alert">{{ mensaje }}</div> }
  <h2>Datos del lugar</h2>
  <label class="campo">Nombre
    <input formControlName="name" type="text" maxlength="150" />
    @if (error('name'); as mensaje) { <small class="field-error">{{ mensaje }}</small> }
  </label>
  <label class="campo">Dirección
    <input formControlName="address" type="text" maxlength="255" />
    @if (error('address'); as mensaje) { <small class="field-error">{{ mensaje }}</small> }
  </label>
  <div class="fila">
    <label class="campo">Ciudad
      <input formControlName="city" type="text" maxlength="100" />
      @if (error('city'); as mensaje) { <small class="field-error">{{ mensaje }}</small> }
    </label>
    <label class="campo">Código postal
      <input formControlName="postalCode" type="text" maxlength="20" />
      @if (error('postalCode'); as mensaje) { <small class="field-error">{{ mensaje }}</small> }
    </label>
    <label class="campo">País
      <input formControlName="country" type="text" maxlength="100" />
      @if (error('country'); as mensaje) { <small class="field-error">{{ mensaje }}</small> }
    </label>
  </div>
  <label class="campo">URL de imagen
    <input formControlName="imageUrl" type="url" placeholder="https://..." />
    @if (error('imageUrl'); as mensaje) { <small class="field-error">{{ mensaje }}</small> }
  </label>
  <div class="acciones">
    <button type="submit" class="boton boton-primario" [disabled]="guardando()">{{ guardando() ? 'Guardando…' : lugar() ? 'Guardar cambios' : 'Crear lugar' }}</button>
    <button type="button" class="boton boton-secundario" (click)="cancelar.emit()">Cancelar</button>
  </div>
</form>
