<article class="admin-card" [class.inactiva]="!evento().isActive">
  @if (evento().imageUrl) { <div class="cover"><img [src]="evento().imageUrl" [alt]="'Imagen de ' + evento().name" loading="lazy" /></div> }
  <div class="flex flex-1 flex-col p-5">
    <span>#{{ evento().id }}</span>
    <h3 class="text-lg font-bold leading-snug text-slate-900">{{ evento().name }}</h3>
    <p class="mt-2 text-sm text-slate-500">{{ evento().description || 'Sin descripción' }}</p>
    <p class="mt-2 text-sm text-slate-500">{{ evento().hostName }} · {{ evento().eventCount }} eventos</p>
    <div class="mt-4 flex flex-wrap items-center gap-2">
      <a class="card-action" [routerLink]="['/experiencias', evento().slug]"><svg lucideEye [size]="16" aria-hidden="true"></svg> Ver</a>
      <a class="card-action" [routerLink]="['/experiencias', evento().id, 'editar']"><svg lucidePencil [size]="16" aria-hidden="true"></svg> Editar</a>
      <button type="button" class="card-action card-toggle" [disabled]="guardando()" (click)="cambiarEstado.emit(evento())"><svg lucidePower [size]="16" aria-hidden="true"></svg> {{ evento().isActive ? 'Desactivar' : 'Activar' }}</button>
    </div>
  </div>
</article>
