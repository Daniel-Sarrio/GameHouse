<form class="formulario" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  @if (errorServidor(); as mensaje) { <div class="alerta" role="alert">{{ mensaje }}</div> }
  @if (errorOpciones()) { <div class="alerta" role="alert">{{ errorOpciones() }} <button type="button" (click)="cargarOpciones()">Reintentar</button></div> }
  <h2>Datos de la experiencia</h2>
  <label class="campo">Nombre
    <input formControlName="name" type="text" maxlength="180" />
    @if (error('name'); as mensaje) { <small class="field-error">{{ mensaje }}</small> }
  </label>
  <label class="campo">Descripción
    <textarea formControlName="description" rows="5" maxlength="2000"></textarea>
    @if (error('description'); as mensaje) { <small class="field-error">{{ mensaje }}</small> }
  </label>
  <label class="campo">URL de imagen
    <input formControlName="imageUrl" type="url" placeholder="https://..." />
    @if (error('imageUrl'); as mensaje) { <small class="field-error">{{ mensaje }}</small> }
  </label>
  <div class="fila">
    <label class="campo">Organizador
      <select formControlName="hostId"><option [ngValue]="0">Selecciona un organizador</option>
        @for (host of opciones().hosts; track host.id) { <option [ngValue]="host.id">{{ host.name }}</option> }
      </select>
      @if (error('hostId'); as mensaje) { <small class="field-error">{{ mensaje }}</small> }
    </label>
    <label class="campo">Estado
      <select formControlName="status"><option value="draft">Borrador</option><option value="published">Publicado</option><option value="archived">Archivado</option><option value="suspended">Suspendido</option></select>
    </label>
    <label class="campo campo-check"><input formControlName="isActive" type="checkbox" /> Experiencia activa</label>
  </div>
  <fieldset class="categorias"><legend>Categorías</legend>
    @for (categoria of opciones().categories; track categoria.id) {
      <label><input type="checkbox" [checked]="categoriaSeleccionada(categoria.id)" (change)="cambiarCategoria(categoria.id, $any($event.target).checked)" /> {{ categoria.name }}</label>
    }
    @if (error('categoryIds'); as mensaje) { <small class="field-error">Selecciona al menos una categoría.</small> }
  </fieldset>
  <div class="acciones">
    <button type="submit" class="boton boton-primario" [disabled]="guardando() || !!errorOpciones() || !opciones().hosts.length || !opciones().categories.length">{{ guardando() ? 'Guardando…' : evento() ? 'Guardar cambios' : 'Crear experiencia' }}</button>
    <button type="button" class="boton boton-secundario" (click)="cancelar.emit()">Cancelar</button>
  </div>
</form>
