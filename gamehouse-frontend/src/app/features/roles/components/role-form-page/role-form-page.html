<div class="contenedor pagina">
  <a routerLink="/roles" class="volver">← Volver a roles</a>
  <p class="eyebrow">GAMEHOUSE / {{ editando() ? 'EDITAR' : 'CREAR' }}</p>
  <h1>{{ editando() ? 'Editar rol' : 'Nuevo rol' }}</h1>
  <p class="subtitulo">Indica el nombre del rol.</p>
  @if (!editando()) {
    <app-role-form [guardando]="guardando()" [errorServidor]="errorServidor()" (guardar)="guardar.emit($event)" (cancelar)="cancelar.emit()" />
  } @else if (cargando()) {
    <app-estado-carga texto="Cargando rol…" />
  } @else if (errorCarga(); as mensaje) {
    <app-mensaje-error [mensaje]="mensaje" (reintentar)="reintentar.emit()" />
  } @else if (rol(); as rol) {
    <app-role-form [rol]="rol" [guardando]="guardando()" [errorServidor]="errorServidor()" (guardar)="guardar.emit($event)" (cancelar)="cancelar.emit()" />
  }
</div>
